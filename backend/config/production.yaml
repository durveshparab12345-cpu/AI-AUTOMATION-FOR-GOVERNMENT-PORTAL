# Production environment configuration
# This configuration is for production deployment

app:
  name: "AI Portal Automation Platform"
  version: "1.0.0"
  environment: "production"
  debug: false
  log_level: "INFO"

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 4

database:
  engine: "postgresql"
  host: "${DB_HOST}"  # Use environment variables
  port: 5432
  name: "${DB_NAME}"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  pool_size: 20
  max_overflow: 40
  echo: false
  ssl_mode: "require"

redis:
  host: "${REDIS_HOST}"
  port: 6379
  db: 0
  password: "${REDIS_PASSWORD}"
  ssl: true

jwt:
  secret_key: "${JWT_SECRET_KEY}"
  algorithm: "HS256"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

cors:
  allowed_origins:
    - "https://yourdomain.com"
    - "https://app.yourdomain.com"
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["Content-Type", "Authorization"]

email:
  smtp_server: "${EMAIL_SMTP_SERVER}"
  smtp_port: 587
  from_email: "${EMAIL_FROM}"
  username: "${EMAIL_USERNAME}"
  password: "${EMAIL_PASSWORD}"
  use_tls: true

storage:
  type: "s3"
  bucket: "${AWS_S3_BUCKET}"
  region: "${AWS_REGION}"
  access_key: "${AWS_ACCESS_KEY}"
  secret_key: "${AWS_SECRET_KEY}"

logging:
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "/var/log/ai_portal/production.log"
  max_size_mb: 100
  backup_count: 30

ai_providers:
  openai:
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4"
    timeout: 30
    enabled: true
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-3-opus"
    timeout: 30
    enabled: true

features:
  enable_audit_logging: true
  enable_rate_limiting: true
  enable_multi_tenancy: true
  enable_workflow_engine: true
  enable_browser_automation: true
  enable_document_ocr: true

monitoring:
  sentry_dsn: "${SENTRY_DSN}"
  datadog_enabled: true
  prometheus_enabled: true

security:
  cors_credentials: true
  https_only: true
  hsts_max_age: 31536000
  content_security_policy: "default-src 'self'"

# TODO: Add more environment-specific configurations
