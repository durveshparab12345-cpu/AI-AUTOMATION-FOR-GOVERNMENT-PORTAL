services:
  - type: pserv
    name: ai-portal-db
    plan: free
    postgresVersion: "15"

  - type: web
    name: ai-portal-backend
    plan: free
    runtime: python310
    buildCommand: cd backend && pip install --upgrade pip setuptools wheel && pip install --only-binary :all: -r requirements.txt && python -m alembic upgrade head
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        value: "change-me-in-production"
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: ai-portal-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://ai-portal-frontend.onrender.com"

  - type: web
    name: ai-portal-frontend
    plan: free
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://ai-portal-backend.onrender.com/api/v1"
