services:
  - type: pserv
    name: ai-portal-db
    plan: free
    postgresVersion: "15"

  - type: web
    name: ai-portal-backend
    plan: free
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        value: "your-secret-key-2026"
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: ai-portal-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://ai-portal-frontend.onrender.com"
      - key: PORT
        value: "8000"

  - type: web
    name: ai-portal-frontend
    plan: free
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://ai-portal-backend.onrender.com/api/v1"
