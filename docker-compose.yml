version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-portal-db
    environment:
      POSTGRES_DB: ai_portal_prod
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Admin@1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-portal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-portal-backend
    environment:
      APP_NAME: "AI Portal Automation Platform"
      APP_ENV: "production"
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-prod-secret-key-change-this}
      DATABASE_URL: "postgresql+asyncpg://postgres:${DB_PASSWORD:-Admin@1234}@postgres:5432/ai_portal_prod"
      REDIS_URL: "redis://redis:6379/0"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      DEMO_MODE: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-portal-frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api/v1"
      VITE_APP_NAME: "AI Portal Automation"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: ai-portal-network
    driver: bridge
